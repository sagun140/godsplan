name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # Fails the PR if any registry entry is blocked. Warnings are shown, not failed:
      # a maintainer reads them before running `godsplan review`.
      - run: npm run check
      - run: npm run build
